<!doctype html><html><head><meta charset="utf-8"><title>Signup</title>
<style>.hint{color:#bbb;background:#fff} button:focus{outline:none} .close{font-size:12px}</style></head><body>
<img src="logo.png">
<div class="btn" onclick="openModal()">Sign up</div>
<form><input type="email" placeholder="Email"><input type="password" placeholder="Password"><p class="hint">Use 8+ characters</p><button type="submit">Create account</button></form>
<button class="close" onclick="closeModal()"><svg width="12" height="12"><path d="M0 0L12 12M12 0L0 12"/></svg></button>
<div id="modal" style="display:none"><h2>Welcome</h2><p>Thanks!</p></div>
<h4>Footer</h4><p style="color:red">Errors are shown in red</p>
</body></html>
