<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proffy | Sua plataforma de estudos online</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700&family=Poppins:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="landing">
    <div class="intro">
      <img class="logo" src="images/logo.svg" alt="Proffy">
      <h1>Sua plaforma de<br>estudos online.</h1>
    </div>

    <img class="hero" src="images/landing.svg" alt="Plataforma de estudos">

    <div class="actions">
      <div class="buttons">
        <a class="button study" href="#study">
          <img src="images/icons/study.svg" alt="">
          Estudar
        </a>
        <a class="button teach" href="#give-classes">
          <img src="images/icons/give-classes.svg" alt="">
          Dar aulas
        </a>
      </div>

      <p class="connections">
        Total de 200 conexões já realizadas
      </p>
    </div>
  </main>
</body>
</html>
